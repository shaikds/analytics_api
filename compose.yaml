services:

  app
    image: analytics-api:v1
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - PORT=8002
      - DATABASE_URL=""
    env_file:
      - .env
    ports:
      -"8080:8002"
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - ./src/app:rw
    develop:
      watch:
        - action: rebuild
        patth: Dockerfile
        - action: rebuild
        path: requirements.txt
        - action: rebuild
        path: compose.yaml